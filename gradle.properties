org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true

# Minecraft / mappings
minecraft_version=1.21.1
# Mappings officiels Mojang utilisés directement (voir build.gradle) - pas de version Yarn à préciser ici.
loader_version=0.16.9

# Mod info (identiques à la version Forge d'origine)
mod_id=skilltree
mod_name=Passive Skill Tree
mod_version=0.7.6+c
mod_group_id=daripher.skilltree
mod_authors=Daripher
mod_description=Adds passive skill tree with player class system

# Dependencies
fabric_api_version=0.110.0+1.21.1

# Cardinal Components -> équivalent Fabric du système de Capabilities Forge.
# ATTENTION : à partir de la branche 1.21, le groupId Maven change de
# dev.onyxstudios.cardinal-components-api vers org.ladysnake.cardinal-components-api
# (renommage confirmé sur le repo GitHub Ladysnake, branche 1.21). Le numéro de version
# ci-dessous est à reconfirmer sur https://github.com/Ladysnake/Cardinal-Components-API/releases
# (onglet Releases, filtrer sur 1.21.x) avant le premier build.
cardinal_components_version=6.1.1

# Trinkets API -> équivalent Fabric de Curios.
# ATTENTION : coordonnées à revérifier sur la page Modrinth de Trinkets pour un build 1.21.1
# (même format que l'original : maven.modrinth:<slug-id>:<version-id>, PAS un numéro simple).
trinkets_version=3.10.0

# AttributeFix (dépendance obligatoire dans le mod d'origine).
# ATTENTION : coordonnées Modrinth à revérifier pour un build 1.21.1.
attributefix_version=22.0.0

# ModMenu - à revérifier aussi pour 1.21.1 si utilisé ailleurs dans le projet.
mod_menu_version=13.0.3