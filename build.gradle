plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.19'
	id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
	archivesName = "PassiveSkillTree-Fabric-${minecraft_version}"
}

repositories {
	mavenCentral()

	maven {
		name = "Ladysnake Mods"
		url = "https://maven.ladysnake.org/releases"
	}

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// CARDINAL COMPONENTS API 8.0.1
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-base:8.0.1"
	implementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:8.0.1"

	// TRINKETS CANARY via variables gradle.properties
	implementation "maven.modrinth:${trinkets_id}:${trinkets_version}"

	// ATTRIBUTEFIX via variables gradle.properties
	implementation "maven.modrinth:${attributefix_id}:${attributefix_version}"
}

loom {
	// Utilisation de votre fichier d'accès v2 validé
	accessWidenerPath = file("src/main/resources/skilltree.accesswidener")

	runs {
		datagen {
			inherit client
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated").absolutePath}"
			vmArg "-Dfabric-api.datagen.modid=skilltree"
			vmArg "-Dfabric.development=true"
			runDir "build/datagen"
		}
	}
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(["-Xmaxerrs", "1000"])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
	main {
		resources {
			srcDir 'src/main/generated'
		}
	}
}

tasks.withType(AbstractCopyTask).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}