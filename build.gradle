plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
	archivesName = "PassiveSkillTree-Fabric-${minecraft_version}"
}

repositories {
	// Cardinal Components API (remplace le système de Capabilities de Forge) + Trinkets, mêmes mainteneurs (Ladysnake)
	// Maven Ladysnake officiel, groupId renommé org.ladysnake.cardinal-components-api pour la branche 1.21
	// (voir la note dans gradle.properties).
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	// AttributeFix et Trinkets - distribués via le maven Modrinth
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	// Mappings officiels Mojang (PAS Yarn) : tout le code de ce portage utilise les noms Mojang
	// (ChatFormatting, ResourceLocation, LivingEntity...), hérités directement de la source Forge
	// d'origine.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Cardinal Components API -> équivalent Fabric du système de Capabilities Forge.
	// Groupe Maven org.ladysnake.* pour la branche 1.21 (dev.onyxstudios.* était l'ancien groupe 1.20).
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"

	// Trinkets API -> équivalent Fabric de Curios (choix confirmé pour la compat accessoires)
	// COORDONNÉES À REVÉRIFIER sur la page de téléchargement Modrinth pour 1.21.1
	// (slug-id et version-id changent probablement par rapport à la version 1.20.1 "5aaWibi9:AHxQGtuC")
	modImplementation "maven.modrinth:trinkets:${trinkets_version}"

	// AttributeFix (dépendance obligatoire dans le mod d'origine)
	// COORDONNÉES À REVÉRIFIER sur Modrinth pour 1.21.1
	modImplementation "maven.modrinth:attributefix:XwbErf6s"
}

loom {
	accessWidenerPath = project.file("src/main/resources/skilltree.accesswidener")
	runs {
		datagen {
			inherit client
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${project.file("src/main/generated").absolutePath}"
			vmArg "-Dfabric-api.datagen.modid=skilltree"
			// Force Fabric à charger toutes les usines de données (Data Providers)
			vmArg "-Dfabric.development=true"
			runDir "build/datagen"
		}
	}
}
// NOTE : ce bloc "datagen" reste tel quel, inchangé depuis la 1.20.1. Conformément à la règle
// absolue du projet, il ne doit JAMAIS être exécuté sur src/main/resources (écraserait l'arbre
// de compétences trié manuellement). Sa présence ici n'est qu'un hook Gradle/Loom requis par la
// structure du projet, pas une invitation à le lancer.

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs.addAll(["-Xmaxerrs", "1000"])
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
	main {
		resources {
			// Inclut explicitement le dossier généré à côté des ressources classiques
			srcDir 'src/main/generated'
		}
	}
}

// Applique la stratégie d'exclusion sur TOUTES les tâches de compression (Jar, Zip) et de copie
tasks.withType(AbstractCopyTask).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}